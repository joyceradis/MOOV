name: Secretaria de Issues - MOOV

on:
  issues:
    types: [opened]

jobs:
  triagem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar ambiente
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar OpenAI
        run: pip install openai

      - name: Triagem da Secretaria
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python -c "
          import os, subprocess
          from openai import OpenAI

          client = OpenAI(api_key=os.environ.get('OPENAI_API_KEY'))
          titulo = os.environ.get('ISSUE_TITLE', '')
          corpo = os.environ.get('ISSUE_BODY', '')
          numero = os.environ.get('ISSUE_NUMBER')

          prompt = f'''Você é a Recepcionista do projeto MOOV.
          Um usuário relatou o seguinte:
          TÍTULO: {titulo}
          DESCRIÇÃO: {corpo}

          Sua tarefa:
          1. Identifique se isso é um 'bug' (erro), 'enhancement' (melhoria) ou 'question' (dúvida).
          2. Escreva um resumo acolhedor (máximo 3 linhas) confirmando o recebimento, informando a prioridade (Alta, Média ou Baixa) e resumindo o problema.
          
          IMPORTANTE: Comece sua resposta EXATAMENTE com a palavra-chave da etiqueta em colchetes. Ex: [bug] ou [enhancement]. Depois pule uma linha e escreva o resumo para o usuário.'''

          try:
              resposta = client.chat.completions.create(
                  model='gpt-4o-mini',
                  messages=[{'role': 'user', 'content': prompt}],
                  max_tokens=250
              )
              texto = resposta.choices[0].message.content.strip()
              
              if texto.startswith('['):
                  fim = texto.find(']')
                  etiqueta = texto[1:fim]
                  comentario = texto[fim+1:].strip()
              else:
                  etiqueta = 'question'
                  comentario = texto
              
              subprocess.run(['gh', 'issue', 'edit', str(numero), '--add-label', etiqueta])
              
              comentario_final = f'👋 **Secretaria MOOV informa:**\n\n{comentario}\n\n*A equipe de engenharia já foi notificada e vai analisar em breve!*'
              subprocess.run(['gh', 'issue', 'comment', str(numero), '--body', comentario_final])

          except Exception as e:
              print(f'Erro na triagem OpenAI: {e}')
              raise e
          "
