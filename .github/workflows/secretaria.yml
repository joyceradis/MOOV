name: Secretaria de Issues - MOOV

# O robô liga APENAS quando alguém cria um novo cartão de tarefa (Issue)
on:
  issues:
    types: [opened]

jobs:
  triagem:
    runs-on: ubuntu-latest
    permissions:
      issues: write # Dá permissão para a secretária colar a etiqueta e comentar

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar ambiente
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar IA
        run: pip install anthropic

      - name: Triagem da Secretaria
        env:
          MINHA_CHAVE_IA: ${{ secrets.CHAVE_DA_IA }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Chave nativa do GitHub para editar a Issue
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python -c "
          import os, subprocess
          from anthropic import Anthropic

          client = Anthropic(api_key=os.environ.get('MINHA_CHAVE_IA'))
          titulo = os.environ.get('ISSUE_TITLE', '')
          corpo = os.environ.get('ISSUE_BODY', '')
          numero = os.environ.get('ISSUE_NUMBER')

          mensagem = f'''Você é a Recepcionista do projeto MOOV.
          Um usuário relatou o seguinte:
          TÍTULO: {titulo}
          DESCRIÇÃO: {corpo}

          Sua tarefa:
          1. Identifique se isso é um 'bug' (erro), 'enhancement' (melhoria) ou 'question' (dúvida).
          2. Escreva um resumo educado e acolhedor (máximo 3 linhas) confirmando o recebimento, informando a prioridade (Alta, Média ou Baixa) e resumindo o problema.
          
          IMPORTANTE: Comece sua resposta EXATAMENTE com a palavra-chave da etiqueta em colchetes. Ex: [bug] ou [enhancement]. Depois pule uma linha e escreva o resumo para o usuário.'''

          try:
              resposta = client.messages.create(
                  model='claude-3-5-haiku-20241022',
                  max_tokens=300,
                  messages=[{'role': 'user', 'content': mensagem}]
              )
              texto = resposta.content[0].text.strip()
              
              if texto.startswith('['):
                  fim = texto.find(']')
                  etiqueta = texto[1:fim]
                  comentario = texto[fim+1:].strip()
              else:
                  etiqueta = 'question'
                  comentario = texto
              
              # Cola a etiqueta colorida no cartão
              subprocess.run(['gh', 'issue', 'edit', str(numero), '--add-label', etiqueta])
              
              # Responde o usuário
              comentario_final = f'👋 **Secretaria MOOV informa:**\n\n{comentario}\n\n*A equipe de engenharia já foi notificada e vai analisar em breve!*'
              subprocess.run(['gh', 'issue', 'comment', str(numero), '--body', comentario_final])

          except Exception as e:
              print(f'Erro na triagem: {e}')
          "
